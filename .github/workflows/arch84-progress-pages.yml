name: Arch84 Progress Dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: arch84-progress-pages
  cancel-in-progress: true
jobs:
  assess:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run evidence-based assessment
        id: evaluate
        run: python3 tools/progress_assess.py
      - name: Preserve assessment even when regression tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch84-assessment
          path: progress/assessment.json
          if-no-files-found: error
  deploy:
    if: always() && needs.assess.result != 'cancelled'
    needs: assess
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download test evidence
        uses: actions/download-artifact@v4
        with:
          name: arch84-assessment
          path: progress
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: progress
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
